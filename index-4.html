<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام حسابات المكتب</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E4E8E7;--paper:#FAFAF8;--ink:#16252D;--mut:#5B6A71;--ln:#C8D0D0;--ac:#2C5B7A;--acd:#1F4259;--pos:#2B7A57;--bad:#B0352B;--warn:#8A6D0B;--tint:#D9E4E8;--in:#fff;--btn:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#12191D;--paper:#1A242A;--ink:#E5ECEE;--mut:#93A3AA;--ln:#33434B;--ac:#6FA6C6;--acd:#0D1418;--pos:#5CC08F;--bad:#F0877C;--warn:#E8C25A;--tint:#22323B;--in:#141D22;--btn:#0D1418}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 'IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif;padding-bottom:76px;-webkit-text-size-adjust:100%}
h1,h2,h3,.big,.dh b{font-family:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--acd);color:#F2F7F9;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.55rem .9rem;padding-top:calc(.55rem + env(safe-area-inset-top,0px));min-height:56px}
.brand{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0}
.brand img{height:38px;width:38px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;flex:none}
header h1{font-size:1.05rem;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{font-size:.72rem;color:#CFDDE4;white-space:nowrap}
main{padding:14px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--paper);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-top:3px solid transparent;background:none;padding:.55rem 2px .5rem;font:inherit;font-size:11.5px;color:var(--mut);font-weight:500}
nav button.on{color:var(--ink);font-weight:600;background:var(--tint);border-top-color:var(--ac)}
.box{background:var(--paper);border:1px solid var(--ln);border-radius:4px;padding:.9rem 1rem;margin:0 0 .9rem}
.grid .box{border-inline-start:4px solid var(--ac)}
details.box summary{cursor:pointer;list-style:none}
select,input,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--ln);border-radius:6px;background:var(--in);color:var(--ink);margin:0 0 6px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;cursor:pointer}
.b{background:var(--ac);color:var(--btn);border:1px solid var(--ac);border-radius:6px;padding:10px 14px;width:100%;font-weight:500}
.b2{background:transparent;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:10px 14px;width:100%;margin-bottom:6px}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:0 6px}.x:hover{color:var(--bad)}
.lnk{background:none;border:0;color:var(--ac);padding:6px 0;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}.grid .box{margin:0}
.big{font-size:1.35rem;font-weight:700;display:block}
.mut,small{color:var(--mut);font-size:12.5px}
.ok{color:var(--pos)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row,.dh,.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dotted var(--ln)}
.row:last-child,.it:last-child{border:0}
.row>div:first-child,.ds{flex:1;min-width:0}.ds small{display:block}
.it input{width:70px;margin:0;padding:6px;text-align:center}
.it b{min-width:70px;text-align:end;font-size:13px}
.dh{border-bottom:2px solid var(--ink);font-size:15px}
.nums{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:12px;font-weight:600;color:var(--mut);border-bottom:1.5px solid var(--ink)}
th,td{border-bottom:1px solid var(--ln);padding:6px;text-align:start}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:9px;border:1px solid var(--ln);background:var(--paper);color:var(--ink);border-radius:6px}
.seg .on{background:var(--ac);border-color:var(--ac);color:var(--btn)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
.chip{border:1px solid var(--ac);background:var(--paper);border-radius:999px;padding:.3rem .85rem;font-size:.85rem;color:var(--ac)}
.ph{display:none}
/*LETTER*/
.cols{display:grid;gap:4px;margin-bottom:4px}.cols input{margin:0;padding:6px;text-align:center;min-width:0}
.pgw{overflow:hidden;margin:0 auto}
.pg{position:relative;width:210mm;height:297mm;background:#fff;color:#000;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.25);transform-origin:top right}
.pg .bg{position:absolute;top:0;left:0;width:210mm;height:297mm;z-index:0}
.pg .ct{position:relative;z-index:1;padding:47mm 46mm 0 24mm;font-size:15px;line-height:1.9;font-family:'IBM Plex Sans Arabic',Arial,Tahoma,sans-serif}
.pg .top{font-size:13px;line-height:1.5;margin-bottom:6px}
.pg .to{display:flex;justify-content:space-between;font-weight:700}
.pg .subj{text-align:center;font-weight:700;margin:6px auto 8px;padding-bottom:6px;border-bottom:1.5px solid #000;width:80%;white-space:pre-line}
.pg .bd{text-align:justify;white-space:pre-wrap;margin:6px 0 12px}
.pg table.lt{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:14px;line-height:1.5}
.pg table.lt th{background:#bdbdbd;font-weight:700;padding:10px 8px;border-bottom:2px solid #000;border-top:1px solid #000}
.pg table.lt td{padding:9px 8px;border-bottom:1px solid #999}
.pg table.lt tbody tr:nth-child(odd) td{background:#f3f3f3}
.pg table.lt tr.tt td{background:#d6d6d6;font-weight:700;border-top:2px solid #000;border-bottom:2px solid #000}
.pg table.lt th,.pg table.lt td{text-align:center}.pg table.lt td.l{text-align:start}
.pg .cl{text-align:center;font-weight:700;margin:14px 0 6px}
.pg .fm{width:46%;margin-inline-start:auto;text-align:center;font-weight:700;line-height:1.5}
.pg .fm img{display:block;max-width:100%;max-height:34mm;margin:2mm auto 0}

#lg{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}#lg[hidden]{display:none}
.lgb{background:var(--paper);border:1px solid var(--ln);border-radius:6px;padding:20px;width:100%;max-width:360px}
.ll{display:block;max-width:60%;max-height:8rem;margin:0 auto 10px;background:#fff;border-radius:6px;padding:6px}
.lgb h2{text-align:center}.lgb small{display:block;text-align:center}
@page{size:A4;margin:0}
@media print{header,nav,.np,button,#lg{display:none!important}.ph{display:block;text-align:center;margin-bottom:12px}.ph img{max-height:80px}.lh .ph{display:none}html,body{background:#fff!important;padding:0}main{padding:12mm 14mm!important;max-width:none}.lh main{padding-top:calc(var(--t)*1cm)!important;padding-bottom:calc(var(--b)*1cm)!important}.box{break-inside:avoid;border-color:#999;background:#fff}.pgw{width:210mm!important;height:auto!important;overflow:visible;margin:0!important}.pg{transform:none!important;box-shadow:none}.pg .bg{position:fixed}.lh .pg .bg{display:none}main.lp{padding:0!important}}
</style>
</head>

<header><div class="brand"><img id="hl" alt="" hidden><h1 id="co"></h1></div><small id="usr"></small><small id="ver"></small><small id="sy"></small><button id="lo" class="x" style="color:#fff;font-size:13px" hidden onclick="logout()">خروج</button></header>
<div id="lg"><div class="lgb"><img id="ll" class="ll" alt="" hidden><h2 style="margin:0 0 4px">تسجيل الدخول</h2><small id="lgv"></small><br><br><input id="lgE" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="lgP" type="password" placeholder="كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="b" onclick="login()">دخول</button><p id="lgm" class="bad"></p></div></div>

 ${sp.length?`<div class="box tw"><b>حسابات المقاولين</b> <small>(كل الدفعات)</small><table><tr><th>المقاول</th><th>العقد</th><th>المدفوع</th><th>المتبقي</th></tr>${sp.map(s=>{const p=sum(s.rows,'paid');return `<tr><td>${esc(s.name)}</td><td>${f(s.contract)}</td><td>${f(p)}</td><td>${f((+s.contract||0)-p)}</td></tr>`}).join('')}</table></div>`:''}`;
}

function pSet(){const s=S.settings;
 return `<div class="box"><b>المكتب</b><input value="${esc(s.company)}" onchange="S.settings.company=this.value;save();render()"><label><input type="checkbox" style="width:auto" ${s.letterhead?'checked':''} onchange="S.settings.letterhead=this.checked;save();render()"> الطباعة على ورق المكتب الجاهز (يخفي الخلفية عند الطباعة)</label></div>
 <div class="box"><b>المشاريع</b>${P().map(p=>`<div class="row"><div>${esc(p.name)}<small> ${esc(p.client||'')}</small></div></div>`).join('')}<input id="pnm" placeholder="اسم مشروع جديد"><input id="pcl" placeholder="العميل"><button class="b" onclick="addProj()">إضافة مشروع</button></div>
 <div class="box"><b>التوقيع والختم</b><br><small>ارفع صورة PNG بخلفية شفافة لتظهر في الكتب.</small><br>التوقيع ${s.sign?'✓':''}<input type="file" accept="image/*" onchange="setImg('sign',this.files[0])">الختم ${s.stamp?'✓':''}<input type="file" accept="image/*" onchange="setImg('stamp',this.files[0])"></div>
 <div class="box"><b>النسخة الاحتياطية</b><br><small>استورد ملف النسخة الاحتياطية القديم هنا، أو صدّر نسخة جديدة.</small><br><br><button class="b2" onclick="expB()">تصدير نسخة احتياطية</button><input type="file" accept=".json,application/json" onchange="impB(this.files[0])"></div>
 <p class="mut">الإصدار ${V}. تُحفظ البيانات في هذا المتصفح، فصدّر نسخة بانتظام.</p>`}
function addProj(){const n=$('pnm').value.trim();if(!n)return alert('اكتب اسم المشروع');P().push({id:uid(),name:n,client:$('pcl').value,location:''});save();render()}
function expB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='نسخة-احتياطية-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function impB(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.ledger)throw 0;if(!confirm('سيتم استبدال البيانات الحالية بالنسخة المستوردة. متابعة؟'))return;const d=blank();S={...d,...j,settings:{...d.settings,...j.settings}};save();render();alert('تم الاستيراد')}catch(e){alert('الملف غير صالح')}};r.readAsText(file)}
boot();
</script>
